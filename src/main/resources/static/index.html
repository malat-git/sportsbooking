<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Sports Court Booking</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231f4e79'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>S</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <h1>Sports Court Booking</h1>
    <p class="sub" id="sub">Sign in to your account</p>

    <div id="authMsg" class="msg hidden"></div>

    <div class="field reg hidden"><label>Full name</label><input id="name"></div>
    <div class="field"><label>Email</label><input id="email" type="email"></div>
    <div class="field reg hidden"><label>Contact number</label><input id="contact"></div>
    <div class="field"><label>Password</label><input id="pass" type="password"></div>

    <button class="btn" id="submitBtn" onclick="submitForm()">Login</button>
    <div class="switch" id="switchText">New student? <a onclick="toggle()">Create an account</a></div>
    <div class="note">Admin: admin@college.edu / admin123</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let mode = 'login';
if (localStorage.getItem('token')) location.href = 'app.html';

function toggle() {
  mode = mode === 'login' ? 'signup' : 'login';
  const signup = mode === 'signup';
  document.querySelectorAll('.reg').forEach(e => e.classList.toggle('hidden', !signup));
  $('sub').textContent = signup ? 'Create your student account' : 'Sign in to your account';
  $('submitBtn').textContent = signup ? 'Create account' : 'Login';
  $('switchText').innerHTML = signup
    ? 'Already registered? <a onclick="toggle()">Sign in</a>'
    : 'New student? <a onclick="toggle()">Create an account</a>';
  $('authMsg').classList.add('hidden');
}

function msg(text) { $('authMsg').textContent = text; $('authMsg').classList.remove('hidden'); }

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}

async function submitForm() {
  try {
    const s = mode === 'login'
      ? await post('/api/auth/login', { email: $('email').value.trim(), password: $('pass').value })
      : await post('/api/auth/signup', { studentName: $('name').value, email: $('email').value,
                                         contactInfo: $('contact').value, password: $('pass').value });
    localStorage.setItem('token', s.token);
    location.href = 'app.html';
  } catch (e) { msg(e.message); }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') submitForm(); });
</script>
</body>
</html>
